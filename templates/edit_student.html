{% extends "base.html" %}
{% block content %}

<h2>✏️ Edit Student</h2>
<p style="color:#555;margin-bottom:20px;">
    Update the student's details. Prediction and confidence will recalculate automatically.
</p>

<form method="POST">
    <label style="font-weight:bold;color:#1F3864;">Student ID:</label>
    <input type="text" value="{{ student[1] or '-' }}" disabled
           style="background:#f0f4f8;color:#666;">

    <label style="font-weight:bold;color:#1F3864;">Full Name:</label>
    <input type="text" name="name" value="{{ student[2] }}" required>

    <label style="font-weight:bold;color:#1F3864;">Knowledge Test (%):</label>
    <input type="number" step="0.1" min="0" max="100"
           name="knowledge_test" value="{{ student[3] or 0 }}" required>

    <label style="font-weight:bold;color:#1F3864;">Study Hours (0–24):</label>
    <input type="number" step="0.1" min="0" max="24"
           name="study_hours" value="{{ student[4] or 0 }}" required>

    <label style="font-weight:bold;color:#1F3864;">Previous Marks (%):</label>
    <input type="number" step="0.1" min="0" max="100"
           name="previous_marks" value="{{ student[5] or 0 }}" required>

    <label style="font-weight:bold;color:#1F3864;">Assignments (%):</label>
    <input type="number" step="0.1" min="0" max="100"
           name="assignments" value="{{ student[6] or 0 }}" required>

    <button type="submit">💾 Save Changes</button>
</form>

<p style="margin-top:20px;">
    <a href="{{ url_for('students') }}">← Back to My Class</a>
</p>

{% endblock %}
